<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d69b20"><title>Beer Oracle 🍺</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#fffdf3,#f5d783 65%,#d58b18);color:#583509;overflow-x:hidden}.foam{height:62px;background:radial-gradient(circle at 20px 45px,#fff 33px,transparent 34px) 0 0/65px 65px repeat-x,linear-gradient(#fff,#fff);filter:drop-shadow(0 5px 3px #b4772144)}main{max-width:680px;margin:auto;padding:18px 20px 55px;text-align:center}h1{font-size:clamp(2.5rem,9vw,4.4rem);margin:12px 0 0;letter-spacing:-.06em;text-shadow:0 2px #fff}header p{margin:0 0 25px;font-weight:700;letter-spacing:.18em;font-size:.75rem}.panel{background:#ffffffdc;border:2px solid #fff;border-radius:25px;padding:26px 20px;margin:20px 0;box-shadow:0 14px 32px #8d570d30;position:relative}.panel:before{content:'✦';position:absolute;right:20px;top:14px;color:#d4a12b}h2{font-size:1.35rem;margin:8px 0 22px}.answer{min-height:125px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.35rem,5vw,1.85rem);font-weight:850;line-height:1.3;padding:12px;color:#81510b}.answer.pop{animation:pop .35s ease}@keyframes pop{from{opacity:.1;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}button{border:0;border-radius:99px;padding:16px 28px;background:linear-gradient(#f9c64e,#cf8610);box-shadow:0 5px 0 #9b5c08;color:#402600;font-size:1rem;font-weight:900;cursor:pointer;width:min(100%,310px)}button:active{transform:translateY(4px);box-shadow:0 1px 0 #9b5c08}footer{font-size:.75rem;color:#63451d;opacity:.8;margin-top:25px}.bubble{position:fixed;border:2px solid #ffffff70;border-radius:50%;pointer-events:none;z-index:-1;animation:rise 10s linear infinite}@keyframes rise{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="foam"></div><main><header><h1>🍺 BEER ORACLE</h1><p>DECISIONI SPUMEGGIANTI</p></header><section class="panel"><h2>Quante birre dovrei bere oggi?</h2><div class="answer" id="quantity" aria-live="polite">Il destino è nel boccale.</div><button onclick="draw('quantity',quantities)">🍻 INTERROGA IL MASTRO BIRRARIO</button></section><section class="panel"><h2>Quale birra prediligo oggi?</h2><div class="answer" id="type" aria-live="polite">Una questione di altissima cultura.</div><button onclick="draw('type',types)">🍺 INTERROGA IL MASTRO BIRRARIO</button></section><footer>Generatore satirico. Le quantità sono battute, non consigli di consumo. Bevi responsabilmente.</footer></main><script>const quantities=['Una sola, ma è enorme','Più di ieri','Tante quante sono le stelle nel cielo','Una per ogni volta che hai bestemmiato','Nessuna, oggi bevi solo Negroni','Due per ogni volta che hai pensato all’Impero Romano','24, ma non più di una all’ora','24, ma tutte in un’ora','Pi greco','La tua età meno la metà della tua età. Moltiplica poi per due e non uscire di casa'];const types=['Quella che vuoi, basta che sia birra','Rossa, come i capelli di una ragazza irlandese, che danzano al ritmo di una brezza','Amara, perché già la vita è troppo dolce','Fruttata, perché ho dei gusti orribili','Nera, come il batacchio di un manzo nero in una notte senza luna nella prateria','Bionda, perché siamo persone semplici','IPA, APA, CGIL, CISL e UIL','Bock, per darmi un tono da intenditore','Moretti da 66, per darmi un tono da muratore','Una Dreher calda','Una birra artigianale, ma solo se è arrivato lo stipendio'];const last={};function draw(id,arr){let i;do{i=Math.floor(Math.random()*arr.length)}while(arr.length>1&&i===last[id]);last[id]=i;const el=document.getElementById(id);el.classList.remove('pop');void el.offsetWidth;el.textContent=arr[i];el.classList.add('pop')}for(let i=0;i<20;i++){const b=document.createElement('div');b.className='bubble';const s=8+Math.random()*27;b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-delay:-${Math.random()*10}s;animation-duration:${7+Math.random()*9}s`;document.body.append(b)}</script></body></html>
