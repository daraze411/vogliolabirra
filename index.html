5"/></svg></div></header><section class="panel"><span class="symbol" aria-hidden="true">🎲</span><h2>Quante birre dovrei bere oggi?</h2><div class="answer" id="quantity" aria-live="polite">?</div><button onclick="draw('quantity',quantities)">🍻 INTERROGA IL MASTRO BIRRARIO</button></section><section class="panel"><span class="symbol" aria-hidden="true">🍻</span><h2>Quale birra dovrei bere oggi?</h2><div class="answer" id="type" aria-live="polite">?</div><button onclick="draw('type',types)">🍺 INTERROGA IL MASTRO BIRRARIO</button></section><div class="share-area"><button class="share" id="share-all" onclick="shareBoth()" disabled>↗ CONDIVIDI I DUE VERDETTI 🍺</button><p id="share-hint">Interroga il Mastro Birrario due volte, una per domanda.</p></div><footer>Generatore satirico. Le quantità sono battute, non consigli di consumo. Bevi responsabilmente.</footer></main><script>const quantities=['Una sola, ma è enorme.','Più di ieri.','Tante quante sono le stelle nel cielo','Una per ogni volta che hai bestemmiato','Due per ogni volta che hai pensato all’Impero Romano','24, ma non più di una all’ora','24, ma tutte in un’ora','Pi greco','La tua età meno la metà della tua età. Moltiplica poi per due e non uscire di casa','Una per ogni promessa che hai fatto di smettere','Un numero primo. Sceglilo con prudenza','Chiedilo al barista: è lui che tiene la contabilità','Bevine tantissime.','Bevine quante pensi di meritarti.','Una per ogni volta che hai detto “Bella Venezia, ma non ci vivrei”.','Prendi un mazzo di carte da poker. Elimina tutti i valori sotto il 5. Mescola bene. Pesca e buona fortuna.','Se vuoi bene a Marty McFly, bevine tre. Altrimenti, zero.','666, ma solo se pensi che Lucifero sia stato frainteso.','Una per tutte le volte che hai detto “Vabbè, solo una stasera...” e poi ti sei svegliato su un tavolo da biliardo in un ARCI di Imperia, vestito da Super Mario.','Tante quanti sono i colori della maglia della tua squadra.','Una per ogni volta che hai pensato di rubare lo stipendio.'];const types=['Quella che vuoi, basta che sia birra','Rossa, come i capelli di una ragazza irlandese che danzano al ritmo di una brezza','Amara, perché già la vita è troppo dolce','Fruttata, perché hai dei gusti orribili','Nera, come il batacchio di un manzo nero in una notte senza luna nella prateria','Bionda, perché sei una persona semplice','IPA, APA, CGIL, CISL e UIL','Bock, per darti un tono da intenditore','Moretti da 66 cl, per darti un tono da muratore','Una Dreher calda','Una birra artigianale, ma solo se ti è arrivato lo stipendio','Quella con l’etichetta più incomprensibile','Una pils, perché oggi fingi di essere equilibrato','Quella alla spina. Anche il Mastro Birrario ha dei principi','Bsssaaaaa, sei ubriaco!!1!','La Kingfisher, detta anche “la birra che sa di Gange e piscio”.','La Guinness, perché al pub non puoi prendere il caffè.','Una birra bosniaca preparata da un ex soldato cieco che usa solo luppoli selezionati da Pedro, il suo amico scimpanzé fuggito da un gruppo di circensi di centrodestra.','Quella in offerta alla Lidl.','Una birra affumicata, perché sei un hipster.','Una Ceres, perché sei più vicino al primate che all’uomo.'];const last={};function draw(id,arr){let i;do{i=Math.floor(Math.random()*arr.length)}while(arr.length>1&&i===last[id]);last[id]=i;const el=document.getElementById(id);el.classList.remove('pop');void el.offsetWidth;el.textContent=arr[i].trim().replace(/(?<!\.)[.!?]$/u, match => match === '.' ? '.' : match).replace(/(?<![.!?])$/u,'.');el.classList.add('pop');document.getElementById('share-all').disabled=!(last.quantity!==undefined&&last.type!==undefined);document.getElementById('share-hint').textContent=last.quantity!==undefined&&last.type!==undefined?'':'Ora interroga il Mastro anche sull’altra domanda.'}function shareText(){const url=location.protocol.startsWith('http')?location.href.split('#')[0]:'';return `🍺 BEER ORACLE\nIl Mastro Birrario ha parlato.\n\nQUANTE BIRRE DOVREI BERE OGGI?\n${document.getElementById('quantity').textContent}\n\nQUALE BIRRA DOVREI BERE OGGI?\n${document.getElementById('type').textContent}${url?'\n\nInterroga il Mastro Birrario: '+url:''}`}
function wrap(ctx,text,maxWidth){const words=text.split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
function createVerdictImage(){
 const c=document.createElement('canvas');c.width=1080;
 const quantity=document.getElementById('quantity').textContent;
 const beerType=document.getElementById('type').textContent;
 // Misuriamo il testo prima di stabilire l'altezza del PNG: niente spazi vuoti enormi.
 const measure=document.createElement('canvas').getContext('2d');
 function section(heading,answer){
  let font=48,lines;
  do{measure.font=`bold ${font}px Georgia,serif`;lines=wrap(measure,answer,840);if(lines.length<=5||font<=32)break;font-=2}while(true);
  return {heading,lines,font,height:70+lines.length*font*1.27+42};
 }
 const sections=[section('QUANTE BIRRE DOVREI BERE OGGI?',quantity),section('QUALE BIRRA DOVREI BERE OGGI?',beerType)];
 const firstTop=500,gap=42,footerSpace=125;
 const totalHeight=Math.ceil(firstTop+sections[0].height+gap+sections[1].height+footerSpace);
 c.height=totalHeight;
 const x=c.getContext('2d');
 const bg=x.createLinearGradient(0,0,0,totalHeight);bg.addColorStop(0,'#fffaf0');bg.addColorStop(.6,'#f4d48b');bg.addColorStop(1,'#b86b09');
 x.fillStyle=bg;x.fillRect(0,0,1080,totalHeight);
 x.fillStyle='#fff9e8';x.beginPath();x.roundRect(65,65,950,totalHeight-155,48);x.fill();x.strokeStyle='#bd831c';x.lineWidth=9;x.stroke();
 x.textAlign='center';x.fillStyle='#633807';x.font='bold 88px Georgia,serif';x.fillText('BEER ORACLE',540,185);
 x.font='bold 31px sans-serif';x.fillText('IL MASTRO BIRRARIO HA PARLATO',540,243);
 // Boccale sotto il sottotitolo, senza coprirlo.
 x.save();x.translate(540,354);x.scale(.73,.73);
 x.fillStyle='#c98516';x.beginPath();x.roundRect(-73,-70,146,175,17);x.fill();
 x.strokeStyle='#9e610d';x.lineWidth=17;x.beginPath();x.arc(83,0,51,-Math.PI/2,Math.PI/2);x.stroke();
 x.fillStyle='#ffe49a';x.fillRect(-42,-50,24,133);x.fillRect(13,-50,24,133);
 x.fillStyle='#fff';for(const [bx,by,r] of [[-65,-76,40],[-20,-100,47],[33,-94,43],[68,-73,38]]){x.beginPath();x.arc(bx,by,r,0,Math.PI*2);x.fill()}x.restore();
 let top=firstTop;
 for(const sec of sections){
  x.fillStyle='#8c590c';x.font='bold 32px sans-serif';x.fillText(sec.heading,540,top);
  x.fillStyle='#382609';x.font=`bold ${sec.font}px Georgia,serif`;
  const lineH=sec.font*1.27;
  sec.lines.forEach((line,i)=>x.fillText(line,540,top+70+i*lineH));
  top+=sec.height+gap;
 }
 x.fillStyle='#fff9e8';x.font='bold 27px sans-serif';x.fillText('VERDETTI SATIRICI · BEVI RESPONSABILMENTE',540,totalHeight-42);
 return c;
}
async function shareBoth(){const text=shareText();const canvas=createVerdictImage();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));const file=blob?new File([blob],'beer-oracle-verdetto.png',{type:'image/png'}):null;try{if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Beer Oracle',text});return}if(navigator.share){await navigator.share({title:'Beer Oracle',text});return}}catch(e){if(e.name==='AbortError')return}if(file){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='beer-oracle-verdetto.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);document.getElementById('share-hint').textContent='Immagine salvata: puoi inviarla su WhatsApp o Telegram.';return}try{await navigator.clipboard.writeText(text);alert('Entrambi i verdetti copiati!')}catch(e){alert(text)}}
for(let i=0;i<20;i++){const b=document.createElement('div');b.className='bubble';const s=8+Math.random()*27;b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-delay:-${Math.random()*10}s;animation-duration:${7+Math.random()*9}s`;document.body.append(b)}</script></body></html>
